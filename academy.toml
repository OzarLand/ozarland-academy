# Registry of OzarLand Academy. Every tool reads this file
# (tools/site/releases.py); nothing else lists the modules or the releases.
#
# The academy is one learning path in five steps. Each step is a module,
# published under its own URL segment; the order of the [[module]] blocks is
# the order of the path.
#
# One [[module]] block per module:
#
#   id        directory under docs/ and URL segment: lowercase letters,
#             digits and hyphens ("day2"). An address of the portal: once
#             published, do not change it.
#   step      the step of the path, a verb ("Discover")
#   title     display title of the module
#   summary   one sentence: what the module gives the reader
#   kind      "single":    one site, docs/<id>/ and docs/<id>.toml
#             "versioned": one site per release, docs/<id>/<release>/ and
#                          docs/<id>/<release>.toml, listed in its
#                          [[module.release]] blocks
#   status    single modules only. "available": docs/<id>/ and
#             docs/<id>.toml exist and the module is built; "planned": no
#             content, the portal publishes one "coming soon" page at /<id>/
#   default   versioned modules only: the release its home page leads to. It
#             must be available.
#
# One [[module.release]] block per release of a versioned module, in the
# order of the version selector:
#
#   id             directory under docs/<module>/ and URL segment: lowercase
#                  letters, digits, dots and hyphens ("2023.1")
#   status         "available": docs/<module>/<id>/ and docs/<module>/<id>.toml
#                               exist, the release is built as a site of its own;
#                  "planned":   no docs directory and no content. The portal
#                               lists it as "coming soon" and publishes one
#                               generated page at /<module>/<id>/
#   openstack      name of the OpenStack release
#   kolla_ansible  Kolla-Ansible version or series
#   tag            upstream tag that is studied (required when available)
#   title          display title; default "<openstack> · Kolla-Ansible <kolla_ansible>"
#
# How to add a module or a release: CONTRIBUTING.md.

[[module]]
id = "lab"
step = "Discover"
title = "Quick lab"
summary = "A disposable OpenStack lab on cloud VMs in about an hour, with break-and-repair exercises."
kind = "single"
status = "available"

[[module]]
id = "deploy"
step = "Deploy"
title = "Deployment patterns"
summary = "Ways to deploy OpenStack with Kolla-Ansible, compared rather than prescribed."
kind = "single"
status = "available"

[[module]]
id = "day2"
step = "Operate"
title = "Kolla-Ansible Academy"
summary = "Kolla-Ansible Day-2 operations learned from the source code, one study per OpenStack release."
kind = "versioned"
default = "2024.1"

# Releases studied, in the order of the version selector.

[[module.release]]
id = "ussuri"
status = "available"
openstack = "Ussuri"
kolla_ansible = "10.x"
tag = "ussuri-eol"

