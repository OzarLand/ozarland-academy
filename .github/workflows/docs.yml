# Portal: source checks, strict build and built-site checks on every pull
# request and on main; deployment to GitHub Pages from main only. One build
# covers every module and release of academy.toml and the root of the portal:
# site/ is the whole portal, with each site under site/<path>/.
#
# The address of the portal is the repository variable SITE_DOMAIN (Settings,
# Secrets and variables, Actions, Variables), academy.ozarland.com: the portal
# is built for https://<SITE_DOMAIN>/ (empty, for the github.io address of
# zensical.base.toml). The custom domain itself is set in Settings, Pages
# (tools/site/README.md, "Address of the portal").
# One-time repository setup and behaviour before it: tools/site/README.md.
#
# The `paths` filters below mean that the workflow does not start for a change
# outside them. Do not make the `build` job a required status check while the
# pull_request filter is there: a pull request that touches none of these
# paths would wait for a check that never starts.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "academy.toml"
      - "zensical.base.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
      # Not part of the site, but their links are checked by check_docs.py.
      - "README.md"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "tools/site/**"
      - "academy.toml"
      - "zensical.base.toml"
      - "requirements-docs.txt"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Default for every job; the deploy job declares the only additions.
permissions:
  contents: read

# One run at a time per branch or pull request. A newer commit of a pull
# request cancels the run in progress. On main a run that has started always
# finishes and the next one waits; only a run that is still waiting is
# replaced by a newer one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: prebuild.py reads the date of the last change of
          # each page, across the move of the pages to docs/<release>/.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # Not committed (5.5 MB), shared by all releases. fetch_vendor.py pins
      # the release and verifies the checksum of the file, restored from this
      # cache or downloaded.
      - name: Cache the vendored Mermaid bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: overrides/assets/vendor/mermaid/mermaid.min.js
          key: vendor-mermaid-${{ hashFiles('tools/site/fetch_vendor.py') }}

      - name: Install the build dependencies
        run: make docs-deps

      # STRICT=1: the warnings of check_docs.py and check_site.py are errors.
      - name: Check the Markdown sources
        run: make docs-check STRICT=1

      # The content conventions of the OzarLand hub (front matter by kind,
      # required sections, risk markers, sensitive data) for the modules that
      # came from repositories which followed them (tools/site/check_content.py).
      - name: Check out the OzarLand hub (content checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: OzarLand/ozarland
          path: .ozarland-hub
          persist-credentials: false

      - name: Check the content conventions of the hub
        run: make docs-content HUB=.ozarland-hub

      - name: Build the site (strict) and check the result
        run: make docs-build STRICT=1

      # Pull requests (and manual runs on another branch) are never deployed:
      # the built site is kept a few days for inspection.
      - name: Upload the built site for inspection
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

      - name: Upload the GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # The Production guide (docs/production/) is generated from its memo sources
  # by a Node script that renders each memo with Playwright: the job checks
  # every memo against the VM runbooks (docs/runbooks/), renders the
  # collection to prove that each memo fits its canvas, and fails when the
  # committed pages are not what the sources generate. It does not deploy
  # anything: the pages and images it checks are the committed ones.
  production:
    name: Production guide (memos)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/production
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the generator and the browser it renders with
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate, check the runbook references, render
        run: node scripts/build.cjs --runbooks ../runbooks

      - name: Generated pages are up to date
        run: git diff --exit-code -- index.md LINKEDIN.md categories

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, production]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment in progress always finishes; the next one waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Fails with an explicit message while GitHub Pages is not enabled with
      # the source "GitHub Actions" (see tools/site/README.md). The build job
      # is not affected: uploading the Pages artifact does not need Pages.
      - name: Check the GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
