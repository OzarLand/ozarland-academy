# Settings of the OKD OpenStack lab site (module `okd` of academy.toml), merged
# with zensical.base.toml by tools/site/releases.py. The pages are the history
# of OzarLand/okd-openstack-lab, moved under docs/okd/. The lab itself
# (Makefile, config/, deployment/, scripts/, tests/) moved with them and keeps
# its layout: run its targets with `make -C docs/okd <target>`. Those files are
# not pages of the site.

[project]
exclude_docs = """
/config/
/deployment/
/scripts/
/tests/
/Makefile
"""
