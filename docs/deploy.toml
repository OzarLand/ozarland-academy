# Settings of the Deployment patterns site (module `deploy` of academy.toml),
# merged with zensical.base.toml by tools/site/releases.py. The pages are the
# history of OzarLand/kolla-ansible-deployment-patterns, moved under
# docs/deploy/. Within a section: its index page, then the pages by name.

[project]
# templates/ holds the page template to copy, not a page: it is read on GitHub
# (Zensical does not build a top-level templates/ directory either).
exclude_docs = """
/templates/
"""
