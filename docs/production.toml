# Settings of the Production guide site (module `production` of academy.toml),
# merged with zensical.base.toml by tools/site/releases.py. The pages are the
# history of OzarLand/production-guide, moved under docs/production/. The
# memo pages, the category indexes, LINKEDIN.md and the catalog of index.md
# are generated by scripts/build.cjs from the memo sources (*.yml); the
# generator (scripts/, templates/, assets/, package.json) is not part of the
# site.

[project]
exclude_docs = """
/scripts/
/templates/
/assets/
/node_modules/
/.cache/
/package.json
/package-lock.json
"""
site_description = "A visual memo for OpenStack operators: one operational lesson per page, to remember, apply and share."

