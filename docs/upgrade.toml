# Settings of the Upgrade journeys site (module `upgrade` of academy.toml),
# merged with zensical.base.toml by tools/site/releases.py. The pages are the
# history of OzarLand/openstack-upgrade-journeys, moved under docs/upgrade/.
# The evidence of the experiments (redacted outputs, checksums, archives) and
# the laboratory scripts moved with them; only their Markdown pages are part
# of the site, the other files are linked on GitHub.

[project]
exclude_docs = """
/journeys/*/evidence/**
!/journeys/*/evidence/**/*.md
/lab/**
!/lab/*/README.md
!/lab/*/index.md
"""
site_description = "Evidence-based paths to bring a legacy OpenStack cloud back to a current release: assessments, experiments, decisions and lab runbooks, starting with Ussuri to 2026.1."

