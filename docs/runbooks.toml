# Settings of the VM runbooks site (module `runbooks` of academy.toml), merged
# with zensical.base.toml by tools/site/releases.py. The pages are the history
# of OzarLand/openstack-vm-runbooks, moved under docs/runbooks/. Sections in
# the order of the home page; within a section, its index page (when it has
# one), then the pages by name.

[project]
# templates/ holds the runbook template to copy, not a page: it is read on
# GitHub (Zensical does not build a top-level templates/ directory either).
exclude_docs = """
/templates/
"""
